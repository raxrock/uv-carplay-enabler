name: Build Windows exe

# Builds UVCarPlay.exe on every push to main (download it from the run's
# "Artifacts"). Pushing a tag like v1.0.0 also publishes it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1

      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --name UVCarPlay carplay_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: UVCarPlay-windows
          path: dist/UVCarPlay.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/UVCarPlay.exe --title "${{ github.ref_name }}" --generate-notes
