name: Build Windows exe

# Builds UVCarPlay.exe on every push to main (download it from the run's
# "Artifacts"). Pushing a tag like v1.0.0 also publishes it as a GitHub Release.
# Nuitka compiles the Python to native code, so the build is one standalone .exe.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install nuitka==2.5.1 cryptography==44.0.1 ordered-set

      - name: Build exe
        run: >
          python -m nuitka --onefile --standalone --assume-yes-for-downloads
          --enable-plugin=tk-inter --windows-console-mode=disable
          --include-module=license_key
          --include-module=enable_carplay
          --include-module=verify_carplay
          --output-filename=UVCarPlay.exe
          carplay_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: UVCarPlay-windows
          path: UVCarPlay.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" UVCarPlay.exe --title "${{ github.ref_name }}" --generate-notes
